name: DB migrate

# Production CD for the database. `main` is the production branch: every merge that adds migrations
# applies them to the production Supabase project automatically (dry run first, then push).
# The same migrations were already tested on the PR by the "DB migrations" job in ci.yml.
# Manual runs default to a dry run. Migrations are never applied from a workstation.
#
# Vercel deploys `main` in parallel, so migrations must stay backward compatible with the previous
# app version (expand now, contract in a later PR).

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (supabase db push --dry-run)"
        type: boolean
        default: true

# Never cancel a migration in flight; queue the next one.
concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/ci.yml.
  SUPABASE_CLI_VERSION: "2.121.0"

jobs:
  migrate:
    name: Apply migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        run: |
          test -d supabase/migrations || { echo "::error::supabase/migrations not found"; exit 1; }
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link production project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations
        run: supabase migration list --linked
      - name: Dry run
        run: supabase db push --dry-run
      - name: Apply migrations
        if: github.event_name == 'push' || !inputs.dry_run
        run: supabase db push
      - name: Verify nothing is pending
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          supabase migration list --linked
          if supabase db push --dry-run | grep -qi "would push"; then
            echo "::error::Migrations are still pending after the push."
            exit 1
          fi

      - uses: actions/setup-node@v7
        if: (github.event_name == 'push' || !inputs.dry_run) && hashFiles('package.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Payload migrations (if the script exists)
        if: (github.event_name == 'push' || !inputs.dry_run) && hashFiles('package.json') != ''
        env:
          DATABASE_URI: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate:payload']?0:1)"; then
            if [ -z "$DATABASE_URI" ]; then echo "::error::PRODUCTION_DATABASE_URL is not set"; exit 1; fi
            npm ci
            npm run db:migrate:payload
          else
            echo "No db:migrate:payload script yet: skipped."
          fi

      - name: Health check
        if: (github.event_name == 'push' || !inputs.dry_run) && vars.PRODUCTION_URL != ''
        run: curl -fsS --retry 5 --retry-delay 15 --max-time 30 "${{ vars.PRODUCTION_URL }}/api/health"
