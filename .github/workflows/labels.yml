name: Labels

# Syncs the repository labels with .github/labels.yml.
# `skip-delete: true`: never deletes a label missing from the file (set to false for a full cleanup).

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Simulate without changing anything"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: ${{ inputs.dry-run || false }}
