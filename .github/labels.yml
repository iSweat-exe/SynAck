# Repository labels (source of truth). Synced by .github/workflows/labels.yml.
# Convention: "type: " (one per issue/PR), "area: " (one or more), "phase: " (one), "priority: " (one),
# "status: " (state), "gate: " (launch conditions). Colors follow DESIGN.md.

# ── Type ────────────────────────────────────────────────────────────
- name: "type: feature"
  color: "1FA463"
  description: "New feature"
- name: "type: bug"
  color: "E5484D"
  description: "Incorrect behavior"
- name: "type: content"
  color: "FB84C3"
  description: "Course, exercise, quiz, article (educational content)"
- name: "type: docs"
  color: "3B82F6"
  description: "Documentation"
- name: "type: design"
  color: "F656AB"
  description: "Visual identity, components, mockups"
- name: "type: refactor"
  color: "A9A0A5"
  description: "Rewrite without behavior change"
- name: "type: perf"
  color: "F5A524"
  description: "Performance"
- name: "type: test"
  color: "D1CACE"
  description: "Tests (Vitest, Playwright, pgTAP)"
- name: "type: chore"
  color: "E6E1E4"
  description: "Maintenance, tooling, dependencies"
- name: "type: security"
  color: "A4202A"
  description: "Security (see SECURITY.md for vulnerabilities)"
- name: "type: decision"
  color: "770D46"
  description: "Decision to make (README open questions, §14)"

# ── Area ────────────────────────────────────────────────────────────
- name: "area: ui"
  color: "FDA3D2"
  description: "Theme, components, layout, front-end pages"
- name: "area: cms"
  color: "FDA3D2"
  description: "Payload: collections, blocks, editorial workflow"
- name: "area: db"
  color: "FDA3D2"
  description: "Supabase: schema, migrations, RLS"
- name: "area: auth"
  color: "FDA3D2"
  description: "Sign-in, profiles, roles and permissions"
- name: "area: exercises"
  color: "FDA3D2"
  description: "Monaco, JS Workers, Pyodide, grader, hints"
- name: "area: protocols"
  color: "FDA3D2"
  description: "TCP / HTTP / DNS / TLS modules"
- name: "area: gamification"
  color: "FDA3D2"
  description: "Progress, badges, streaks, SM-2, points, leaderboard"
- name: "area: seo"
  color: "FDA3D2"
  description: "Meta tags, sitemap, RSS, structured data"
- name: "area: security"
  color: "FDA3D2"
  description: "CSP, rate limiting, 2FA, anti-abuse"
- name: "area: infra"
  color: "FDA3D2"
  description: "CI/CD, Vercel, backups, monitoring"
- name: "area: legal"
  color: "FDA3D2"
  description: "Licenses, legal notices, GDPR"
- name: "area: content"
  color: "FDA3D2"
  description: "Writing paths, courses and articles"

# ── Phase (README §13 / CHECKLIST) ──────────────────────────────────
- name: "phase: 0-kickoff"
  color: "FFE0F0"
  description: "Repository, governance, accounts"
- name: "phase: 1-foundations"
  color: "FEC2E1"
  description: "Technical base, CMS, permissions, theme"
- name: "phase: 2-core-learning"
  color: "FDA3D2"
  description: "Courses, exercises, auth, quiz, first path"
- name: "phase: 3-protocols-engagement"
  color: "FB84C3"
  description: "Protocols, badges, SM-2, leaderboard"
- name: "phase: 4-go-live"
  color: "F656AB"
  description: "Watch, legal, security, operations, launch"
- name: "phase: post-v1"
  color: "7F757B"
  description: "Out of V1: do not start"

# ── Priority ────────────────────────────────────────────────────────
- name: "priority: critical"
  color: "A4202A"
  description: "Blocking: prevents launch or breaks production"
- name: "priority: high"
  color: "E5484D"
  description: "To do in the current phase"
- name: "priority: medium"
  color: "F5A524"
  description: "Normal"
- name: "priority: low"
  color: "A9A0A5"
  description: "When there is time"

# ── Status ──────────────────────────────────────────────────────────
- name: "status: needs-triage"
  color: "F5A524"
  description: "New issue to qualify"
- name: "status: needs-decision"
  color: "8A5A00"
  description: "Waiting for a decision from the project creator"
- name: "status: blocked"
  color: "5F565B"
  description: "Blocked by another task or a third party"
- name: "status: ready"
  color: "1FA463"
  description: "Qualified, ready to be picked up"

# ── Launch ──────────────────────────────────────────────────────────
- name: "gate: beta-launch"
  color: "470A2B"
  description: "Required before the public opening (README §11 bis)"

# ── PR workflow / misc ──────────────────────────────────────────────
- name: "preview"
  color: "DDEBFF"
  description: "Triggers a Vercel preview deployment for the PR"
- name: "breaking-change"
  color: "E5484D"
  description: "Breaks compatibility or is destructive (schema, API, content); required for DROP/TRUNCATE migrations"
- name: "dependencies"
  color: "3B82F6"
  description: "Dependency updates (Dependabot)"
- name: "github-actions"
  color: "2E292C"
  description: "GitHub Actions updates (Dependabot)"
- name: "good first issue"
  color: "7057FF"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Help welcome"
- name: "duplicate"
  color: "D1CACE"
  description: "Already exists"
- name: "invalid"
  color: "D1CACE"
  description: "Not valid"
- name: "wontfix"
  color: "D1CACE"
  description: "Will not be worked on"
